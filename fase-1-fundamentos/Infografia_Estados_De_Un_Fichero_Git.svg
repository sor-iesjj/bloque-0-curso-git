<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Del fichero nuevo a GitHub</title>
  <desc id="descripcion">Cuatro pasos: fichero nuevo sin seguimiento; git add lo prepara; git commit lo guarda en el historial local; git push publica el commit en GitHub.</desc>
  <rect width="1600" height="900" fill="#F7F4ED"/>
  <rect x="0" y="0" width="1600" height="14" fill="#1C2931"/>
  <text x="64" y="91" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="50" font-weight="800">DEL FICHERO NUEVO A GITHUB</text>
  <text x="67" y="137" fill="#54616A" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25">Un mismo trabajo · cuatro momentos</text>

  <rect x="64" y="177" width="1091" height="48" rx="24" fill="#E7EBE8"/>
  <text x="609" y="209" text-anchor="middle" fill="#3B4B54" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19" font-weight="800" letter-spacing="3">EN TU ORDENADOR</text>
  <rect x="1216" y="177" width="320" height="48" rx="24" fill="#DEE8E3"/>
  <text x="1376" y="209" text-anchor="middle" fill="#315646" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19" font-weight="800" letter-spacing="3">EN GITHUB</text>

  <rect x="64" y="255" width="320" height="458" rx="26" fill="#FFFDFC" stroke="#DDD7CB" stroke-width="3"/>
  <rect x="64" y="255" width="320" height="16" rx="8" fill="#D95C43"/>
  <circle cx="105" cy="310" r="22" fill="#FBE5DF"/>
  <text x="105" y="318" text-anchor="middle" fill="#B94C36" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="800">1</text>
  <path d="M188 348h79l26 27v98H188z" fill="#FFF6F2" stroke="#D95C43" stroke-width="5" stroke-linejoin="round"/>
  <path d="M267 349v27h26" fill="none" stroke="#D95C43" stroke-width="5"/>
  <path d="M209 405h61M209 427h48" stroke="#D95C43" stroke-width="6" stroke-linecap="round"/>
  <text x="224" y="524" text-anchor="middle" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="31" font-weight="800">FICHERO NUEVO</text>
  <text x="224" y="563" text-anchor="middle" fill="#A54835" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="23" font-weight="700">Sin seguimiento</text>
  <text x="224" y="620" text-anchor="middle" fill="#48565E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19">Lo creas en tu carpeta.</text>
  <text x="224" y="650" text-anchor="middle" fill="#48565E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19">Git aún no lo incluye.</text>

  <path d="M395 480h34" stroke="#1C2931" stroke-width="7" stroke-linecap="round"/>
  <path d="m421 468 22 12-22 12z" fill="#1C2931"/>

  <rect x="449" y="255" width="320" height="458" rx="26" fill="#FFFDFC" stroke="#DDD7CB" stroke-width="3"/>
  <rect x="449" y="255" width="320" height="16" rx="8" fill="#D79B2F"/>
  <circle cx="490" cy="310" r="22" fill="#FBF0D8"/>
  <text x="490" y="318" text-anchor="middle" fill="#946719" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="800">2</text>
  <path d="M555 423h107v53H555z" fill="#FFF9E9" stroke="#C58B25" stroke-width="5" stroke-linejoin="round"/>
