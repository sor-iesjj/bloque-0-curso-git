  <path d="M632 343v17h16" fill="none" stroke="#C58B25" stroke-width="4"/>
  <text x="609" y="524" text-anchor="middle" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="31" font-weight="800">PREPARADO</text>
  <text x="609" y="563" text-anchor="middle" fill="#91621B" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="23" font-weight="700">Área de preparación</text>
  <text x="609" y="619" text-anchor="middle" fill="#48565E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19">Listo para el próximo commit.</text>
  <rect x="504" y="660" width="210" height="37" rx="18" fill="#FBF0D8"/>
  <text x="609" y="685" text-anchor="middle" fill="#6C4B17" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="18" font-weight="700">git add archivo</text>

  <path d="M780 480h34" stroke="#1C2931" stroke-width="7" stroke-linecap="round"/>
  <path d="m806 468 22 12-22 12z" fill="#1C2931"/>

  <rect x="834" y="255" width="320" height="458" rx="26" fill="#FFFDFC" stroke="#DDD7CB" stroke-width="3"/>
  <rect x="834" y="255" width="320" height="16" rx="8" fill="#33728C"/>
  <circle cx="875" cy="310" r="22" fill="#E1F0F5"/>
  <text x="875" y="318" text-anchor="middle" fill="#285D73" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="800">3</text>
  <path d="M935 366h110v105H935z" fill="#EAF5F7" stroke="#33728C" stroke-width="5" stroke-linejoin="round"/>
  <path d="M951 382h79v66h-79z" fill="#FFFDFC" stroke="#33728C" stroke-width="3"/>
  <path d="M966 400h50M966 414h50M966 428h36" stroke="#33728C" stroke-width="4" stroke-linecap="round"/>
  <text x="994" y="524" text-anchor="middle" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="31" font-weight="800">GUARDADO</text>
  <text x="994" y="563" text-anchor="middle" fill="#285D73" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="23" font-weight="700">Commit local</text>
  <text x="994" y="619" text-anchor="middle" fill="#48565E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19">La foto queda en tu equipo.</text>
  <rect x="865" y="660" width="258" height="37" rx="18" fill="#E1F0F5"/>
  <text x="994" y="685" text-anchor="middle" fill="#285D73" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="16" font-weight="700">git commit -m "mensaje"</text>

  <path d="M1165 480h34" stroke="#1C2931" stroke-width="7" stroke-linecap="round"/>
  <path d="m1191 468 22 12-22 12z" fill="#1C2931"/>

  <rect x="1219" y="255" width="320" height="458" rx="26" fill="#FDFEFC" stroke="#CCDAD1" stroke-width="3"/>
  <rect x="1219" y="255" width="320" height="16" rx="8" fill="#3D7758"/>
  <circle cx="1260" cy="310" r="22" fill="#E2F0E7"/>
  <text x="1260" y="318" text-anchor="middle" fill="#306347" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="800">4</text>
  <path d="M1306 459h139c28 0 42-17 42-38 0-22-17-39-39-40-7-27-31-46-59-46-30 0-54 20-60 49-25-2-46 15-46 38 0 20 14 37 37 37z" fill="#E9F4EC" stroke="#3D7758" stroke-width="5" stroke-linejoin="round"/>
  <path d="M1364 390h33l11 12v35h-44z" fill="#FFFFFF" stroke="#3D7758" stroke-width="3" stroke-linejoin="round"/>
  <path d="M1397 391v11h11" fill="none" stroke="#3D7758" stroke-width="3"/>
  <text x="1379" y="524" text-anchor="middle" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="31" font-weight="800">PUBLICADO</text>
  <text x="1379" y="563" text-anchor="middle" fill="#306347" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="23" font-weight="700">En GitHub</text>
  <text x="1379" y="619" text-anchor="middle" fill="#48565E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19">El commit ya está en remoto.</text>
  <rect x="1249" y="660" width="260" height="37" rx="18" fill="#E2F0E7"/>
  <text x="1379" y="685" text-anchor="middle" fill="#306347" font-family="Menlo, DejaVu Sans Mono, monospace" font-size="17" font-weight="700">git push -u origin main</text>

  <path d="M64 761h1475" stroke="#DCD7CE" stroke-width="2"/>
  <text x="800" y="818" text-anchor="middle" fill="#1C2931" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="29" font-weight="800">ADD prepara  ·  COMMIT guarda en tu equipo  ·  PUSH sube a GitHub</text>
  <text x="800" y="857" text-anchor="middle" fill="#59666D" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="18">Ejemplo: un fichero nuevo dentro de un repositorio Git ya creado.</text>
</svg>
